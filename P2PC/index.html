<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canal — Voz P2P</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #171310;
    --panel: #1d1712;
    --panel-raised: #241d16;
    --line: #3d3120;
    --amber: #ffb000;
    --amber-dim: #8a6420;
    --text: #f2e9da;
    --muted: #8a7f6e;
    --danger: #e2543a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(255,176,0,0.05), transparent 60%);
    color: var(--text);
    max-width: 560px;
    margin: 32px auto;
    padding: 0 18px 60px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.3px;
  }

  header .canal-id {
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 12px;
    color: var(--amber-dim);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .panel + .panel { margin-top: -6px; }

  .campo { margin-bottom: 14px; }
  .campo:last-child { margin-bottom: 0; }

  .etiqueta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 7px;
    display: block;
  }

  input, select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }

  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  input::placeholder { color: #55493a; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid var(--amber-dim);
    background: transparent;
    color: var(--amber);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  button:hover { background: rgba(255,176,0,0.1); }
  button:active { background: rgba(255,176,0,0.18); }

  button.primario {
    background: var(--amber);
    color: #1a1204;
    border-color: var(--amber);
  }
  button.primario:hover { background: #ffc63d; }

  button.peligro { border-color: var(--danger); color: var(--danger); }
  button.peligro:hover { background: rgba(226,84,58,0.12); }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .fila { display: flex; gap: 8px; }
  .fila input { flex: 1; }
  .fila button { flex-shrink: 0; }

  .codigo-display {
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: 1.5px;
    user-select: all;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px dashed var(--amber-dim);
    border-radius: 3px;
  }

  #vistaInicio.oculto,
  #vistaSala.oculto,
  .oculto { display: none !important; }

  .estado-linea {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .punto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .punto.on { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  /* ---- Vista sala estilo Meet ---- */
  #vistaSala.oculto { display: none !important; }
  #vistaSala {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 90px);
  }

  .barra-sala {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .barra-sala .codigo-mini {
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 12px;
    color: var(--amber-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
    user-select: all;
  }
  .barra-sala .codigo-mini:hover { border-color: var(--amber-dim); color: var(--amber); }
  .barra-sala .estado-linea { margin-top: 0; }

  .grilla-tiles {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    align-content: start;
    margin-bottom: 24px;
  }

  .tile {
    position: relative;
    aspect-ratio: 4 / 3;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .tile.hablando {
    border-color: var(--amber);
    box-shadow: 0 0 0 4px rgba(255,176,0,0.13);
  }
  .tile.yo { border-style: dashed; }

  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #1a1204;
    flex-shrink: 0;
  }

  .tile-etiqueta {
    position: absolute;
    left: 10px;
    bottom: 9px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
  }
  .tile-nombre {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .tile-mute-icono {
    font-size: 12px;
    opacity: 0.85;
    flex-shrink: 0;
  }

  /* ---- Barra de controles flotante, al estilo Meet ---- */
  .barra-controles {
    position: sticky;
    bottom: 18px;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding-top: 10px;
  }

  .boton-control {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .boton-control:hover { border-color: var(--amber-dim); }
  .boton-control.activo {
    background: var(--amber);
    color: #1a1204;
    border-color: var(--amber);
  }
  .boton-control.salir {
    background: var(--danger);
    border-color: var(--danger);
    color: #1a0a08;
    width: 68px;
    border-radius: 26px;
  }
  .boton-control.salir:hover { background: #f26a4f; }

  .area-pantalla {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 16px;
  }
  .pantalla-header {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #videoPantalla {
    width: 100%;
    display: block;
    border-radius: 8px;
    background: #000;
  }
</style>
</head>
<body>

<header>
  <h1>📻 Canal</h1>
  <div class="canal-id" id="miIdChico"></div>
</header>

<!-- VISTA INICIO: elegir nombre y crear/unirse -->
<div id="vistaInicio">
  <div class="panel">
    <div class="campo">
      <label class="etiqueta">Tu nombre</label>
      <input id="inputNombre" placeholder="¿Cómo te decimos?" maxlength="20">
    </div>
    <div class="campo">
      <label class="etiqueta">Micrófono de entrada</label>
      <select id="selectMic"><option>Permití el micrófono para ver opciones</option></select>
    </div>
  </div>

  <div class="panel">
    <div class="campo">
      <button id="btnCrear" class="primario" style="width:100%">Crear canal nuevo</button>
    </div>
    <div class="campo">
      <label class="etiqueta">O unite con un código</label>
      <div class="fila">
        <input id="inputCodigo" placeholder="código del canal">
        <button id="btnUnirse">Unirme</button>
      </div>
    </div>
  </div>
  <div class="estado-linea"><span class="punto" id="puntoInicio"></span><span id="estadoInicio">Ingresá tu nombre para empezar</span></div>
</div>

<!-- VISTA SALA: ya conectado -->
<div id="vistaSala" class="oculto">
  <div class="barra-sala">
    <div class="estado-linea"><span class="punto on"></span><span id="estadoSala">Conectado</span></div>
    <div class="codigo-mini" id="codigoSala" title="Click para copiar y compartir"></div>
  </div>

  <div class="area-pantalla oculto" id="areaPantalla">
    <div class="pantalla-header" id="pantallaPresentador"></div>
    <video id="videoPantalla" autoplay playsinline></video>
  </div>

  <div class="grilla-tiles" id="grillaTiles"></div>

  <div class="barra-controles">
    <button class="boton-control" id="btnMute" title="Silenciar micrófono">🎤</button>
    <button class="boton-control" id="btnPantalla" title="Compartir pantalla">🖥️</button>
    <button class="boton-control salir" id="btnSalir" title="Salir del canal">📴</button>
  </div>
</div>

<div id="audios"></div>

<script>
let peer = null;
let miStream = null;
let muteado = false;
let esAnfitrion = false;
let miNombre = '';

let roster = [];                    // solo anfitrión: [{id, name}]
let dataConnections = new Map();    // solo anfitrión: peerId -> DataConnection
let llamadas = new Map();           // todos: peerId -> RTCall (voz)

let pantallaStream = null;          // mi stream de pantalla, si estoy compartiendo
let llamadasPantalla = new Map();   // peerId -> RTCall (salientes, cuando yo comparto)

// --- Elementos ---
const vistaInicio = document.getElementById('vistaInicio');
const vistaSala = document.getElementById('vistaSala');
const inputNombre = document.getElementById('inputNombre');
const selectMic = document.getElementById('selectMic');
const btnCrear = document.getElementById('btnCrear');
const btnUnirse = document.getElementById('btnUnirse');
const inputCodigo = document.getElementById('inputCodigo');
const estadoInicio = document.getElementById('estadoInicio');
const puntoInicio = document.getElementById('puntoInicio');
const codigoSala = document.getElementById('codigoSala');
const grillaTiles = document.getElementById('grillaTiles');
const btnMute = document.getElementById('btnMute');
const btnPantalla = document.getElementById('btnPantalla');
const areaPantalla = document.getElementById('areaPantalla');
const videoPantalla = document.getElementById('videoPantalla');
const pantallaPresentador = document.getElementById('pantallaPresentador');
const btnSalir = document.getElementById('btnSalir');
const estadoSala = document.getElementById('estadoSala');
const miIdChico = document.getElementById('miIdChico');
const audiosEl = document.getElementById('audios');

// --- Sonido de entrada/salida (sintetizado, sin archivos externos) ---
let audioCtx = null;
function tono(frecInicial, frecFinal, duracion) {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(frecInicial, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(frecFinal, audioCtx.currentTime + duracion);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duracion);
}
const sonidoEntrada = () => tono(440, 880, 0.18);
const sonidoSalida = () => tono(660, 330, 0.22);

// --- Micrófono ---
async function iniciarMicrofono(deviceId) {
  if (miStream) miStream.getTracks().forEach(t => t.stop());
  miStream = await navigator.mediaDevices.getUserMedia({
    audio: deviceId ? { deviceId: { exact: deviceId } } : true
  });
}

async function listarMicros() {
  const dispositivos = await navigator.mediaDevices.enumerateDevices();
  const micros = dispositivos.filter(d => d.kind === 'audioinput');
  selectMic.innerHTML = micros
    .map(m => `<option value="${m.deviceId}">${m.label || 'Micrófono sin nombre'}</option>`)
    .join('');
}

selectMic.addEventListener('change', () => iniciarMicrofono(selectMic.value));

// Pedimos permiso apenas carga la página para poder listar los micrófonos
(async () => {
  try {
    await iniciarMicrofono();
    await listarMicros();
    estadoInicio.textContent = 'Ingresá tu nombre para empezar';
  } catch (e) {
    estadoInicio.textContent = 'Necesitamos permiso de micrófono para continuar';
  }
})();

btnMute.addEventListener('click', () => {
  if (!miStream) return;
  muteado = !muteado;
  miStream.getAudioTracks().forEach(t => t.enabled = !muteado);
  btnMute.textContent = muteado ? '🔇' : '🎤';
  btnMute.classList.toggle('activo', muteado);
  actualizarTilePropio();
});

btnSalir.addEventListener('click', () => {
  location.reload();
});

// Avisamos que nos vamos apenas se cierra o recarga la pestaña, en vez de dejar que WebRTC lo note solo
window.addEventListener('beforeunload', () => {
  llamadas.forEach((llamada) => llamada.close());
  llamadasPantalla.forEach((llamada) => llamada.close());
  dataConnections.forEach((conn) => conn.close());
  if (peer) peer.destroy();
});

// --- Servidores de conexión: STUN (descubrir IP pública) + TURN (respaldo si falla la conexión directa) ---
const configIce = {
  iceServers: [
    { urls: 'stun:stun.relay.metered.ca:80' },
    { urls: 'turn:global.relay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:global.relay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:global.relay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

// --- Crear peer base ---
function crearPeerBase() {
  peer = new Peer({ config: configIce });

  peer.on('call', (llamada) => {
    const esPantalla = llamada.metadata && llamada.metadata.tipo === 'pantalla';
    if (esPantalla) {
      llamada.answer(); // solo recibimos, no mandamos nada de vuelta en esta llamada
      manejarPantallaEntrante(llamada);
      return;
    }
    llamada.answer(miStream);
    const nombreRemoto = (llamada.metadata && llamada.metadata.name) || 'Anónimo';
    registrarLlamada(llamada.peer, llamada, nombreRemoto);
  });

  peer.on('connection', (conn) => {
    if (!esAnfitrion) return;
    manejarNuevoJoiner(conn);
  });

  peer.on('error', (err) => {
    estadoSala.textContent = 'Error: ' + err.type;
    console.error(err);
  });
}

function pasarASala(codigoMostrar) {
  vistaInicio.classList.add('oculto');
  vistaSala.classList.remove('oculto');
  miIdChico.textContent = peer.id.slice(0, 8);
  codigoSala.textContent = 'Canal: ' + (codigoMostrar || peer.id).slice(0, 8);
  codigoSala.dataset.codigoCompleto = codigoMostrar || peer.id;
  agregarTilePropio();
  detectarHablaPropia();
}

codigoSala.addEventListener('click', () => {
  const codigo = codigoSala.dataset.codigoCompleto;
  if (codigo) navigator.clipboard.writeText(codigo);
});

// --- Color de avatar determinístico según el nombre ---
function colorDeNombre(nombre) {
  let hash = 0;
  for (let i = 0; i < nombre.length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 55%)`;
}

function iniciales(nombre) {
  const partes = nombre.trim().split(/\s+/);
  return ((partes[0]?.[0] || '?') + (partes[1]?.[0] || '')).toUpperCase();
}

function agregarTilePropio() {
  const tile = document.createElement('div');
  tile.className = 'tile yo';
  tile.id = 'tile-propio';
  tile.innerHTML = `
    <div class="avatar" style="background:${colorDeNombre(miNombre)}">${iniciales(miNombre)}</div>
    <div class="tile-etiqueta">
      <span class="tile-nombre">${escaparHtml(miNombre)} (vos)</span>
      <span class="tile-mute-icono" id="iconoMutePropio"></span>
    </div>
  `;
  grillaTiles.prepend(tile);
}

function actualizarTilePropio() {
  const icono = document.getElementById('iconoMutePropio');
  if (icono) icono.textContent = muteado ? '🔇' : '';
}

// Analiza el propio micrófono para iluminar tu tile cuando hablás
function detectarHablaPropia() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const fuente = ctx.createMediaStreamSource(miStream);
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 512;
  fuente.connect(analizador);
  const datos = new Uint8Array(analizador.frequencyBinCount);

  function chequear() {
    const tile = document.getElementById('tile-propio');
    if (!tile) return requestAnimationFrame(chequear);
    analizador.getByteFrequencyData(datos);
    const volumen = datos.reduce((a, b) => a + b, 0) / datos.length;
    tile.classList.toggle('hablando', volumen > 15 && !muteado);
    requestAnimationFrame(chequear);
  }
  chequear();
}

// --- Crear canal ---
btnCrear.addEventListener('click', () => {
  miNombre = inputNombre.value.trim() || 'Anónimo';
  esAnfitrion = true;
  crearPeerBase();
  peer.on('open', (id) => {
    pasarASala(id);
    estadoSala.textContent = 'Canal creado. Esperando gente...';
  });
});

// --- Unirse a canal ---
btnUnirse.addEventListener('click', () => {
  const codigo = inputCodigo.value.trim();
  if (!codigo) return;
  miNombre = inputNombre.value.trim() || 'Anónimo';
  esAnfitrion = false;
  crearPeerBase();

  peer.on('open', () => {
    const conn = peer.connect(codigo, { metadata: { name: miNombre } });

    conn.on('open', () => {
      pasarASala(null);
      estadoSala.textContent = 'Conectado al canal';
    });

    conn.on('data', (data) => {
      if (data.type === 'roster') {
        data.peers.forEach((p) => {
          if (p.id !== peer.id) llamarA(p.id, p.name);
        });
      }
      if (data.type === 'peer-salio') {
        const llamadaVieja = llamadas.get(data.id);
        if (llamadaVieja) llamadaVieja.close();
        quitarParticipante(data.id);
      }
    });

    conn.on('error', (err) => {
      estadoInicio.textContent = 'No se pudo conectar a ese canal';
      console.error(err);
    });
  });
});

// --- Lógica del anfitrión: nuevo joiner llega ---
function manejarNuevoJoiner(conn) {
  conn.on('open', () => {
    const nombreJoiner = (conn.metadata && conn.metadata.name) || 'Anónimo';
    const peersActuales = [{ id: peer.id, name: miNombre }, ...roster];
    conn.send({ type: 'roster', peers: peersActuales });

    roster.push({ id: conn.peer, name: nombreJoiner });
    dataConnections.set(conn.peer, conn);
  });

  conn.on('close', () => {
    roster = roster.filter((p) => p.id !== conn.peer);
    dataConnections.delete(conn.peer);
    // Avisamos al resto para que lo saquen de su lista, sin esperar a que la llamada de voz se dé cuenta sola
    dataConnections.forEach((otraConn) => {
      otraConn.send({ type: 'peer-salio', id: conn.peer });
    });
  });
}

// --- Llamar a alguien que ya está en el canal ---
function llamarA(idRemoto, nombreRemoto) {
  const llamada = peer.call(idRemoto, miStream, { metadata: { name: miNombre } });
  registrarLlamada(idRemoto, llamada, nombreRemoto);
}

// --- Registrar llamada de voz (entrante o saliente) + UI ---
function registrarLlamada(idRemoto, llamada, nombreRemoto) {
  llamadas.set(idRemoto, llamada);
  agregarParticipanteUI(idRemoto, nombreRemoto);
  sonidoEntrada();

  llamada.on('stream', (streamRemoto) => {
    let audioEl = document.getElementById('audio-' + idRemoto);
    if (!audioEl) {
      audioEl = document.createElement('audio');
      audioEl.id = 'audio-' + idRemoto;
      audioEl.autoplay = true;
      audiosEl.appendChild(audioEl);
    }
    audioEl.srcObject = streamRemoto;
    detectarHabla(idRemoto, streamRemoto);
  });

  llamada.on('close', () => quitarParticipante(idRemoto));
  llamada.on('error', () => quitarParticipante(idRemoto));

  // Si ya estoy compartiendo pantalla, este participante nuevo también tiene que verla
  if (pantallaStream && !llamadasPantalla.has(idRemoto)) {
    iniciarLlamadaPantallaCon(idRemoto);
  }
}

// --- Compartir pantalla ---
btnPantalla.addEventListener('click', () => {
  if (pantallaStream) {
    detenerCompartirPantalla();
  } else {
    iniciarCompartirPantalla();
  }
});

async function iniciarCompartirPantalla() {
  try {
    pantallaStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
  } catch (e) {
    return; // el usuario canceló el selector de pantalla/ventana
  }
  btnPantalla.classList.add('activo');
  btnPantalla.textContent = '🛑';

  // Le mandamos el video a todos los que ya tengo en llamada de voz
  llamadas.forEach((_, idRemoto) => iniciarLlamadaPantallaCon(idRemoto));

  // Si el usuario corta desde el control nativo del navegador ("Dejar de compartir")
  pantallaStream.getVideoTracks()[0].addEventListener('ended', detenerCompartirPantalla);
}

function iniciarLlamadaPantallaCon(idRemoto) {
  const llamada = peer.call(idRemoto, pantallaStream, { metadata: { tipo: 'pantalla', name: miNombre } });
  llamadasPantalla.set(idRemoto, llamada);
}

function detenerCompartirPantalla() {
  if (!pantallaStream) return;
  pantallaStream.getTracks().forEach((t) => t.stop());
  pantallaStream = null;
  llamadasPantalla.forEach((llamada) => llamada.close());
  llamadasPantalla.clear();
  btnPantalla.classList.remove('activo');
  btnPantalla.textContent = '🖥️';
}

// --- Recibir la pantalla de otro participante ---
function manejarPantallaEntrante(llamada) {
  const nombre = (llamada.metadata && llamada.metadata.name) || 'Alguien';

  llamada.on('stream', (streamRemoto) => {
    videoPantalla.srcObject = streamRemoto;
    pantallaPresentador.textContent = `${nombre} está compartiendo su pantalla`;
    areaPantalla.classList.remove('oculto');
  });

  llamada.on('close', () => {
    areaPantalla.classList.add('oculto');
    videoPantalla.srcObject = null;
  });
}

function quitarParticipante(idRemoto) {
  if (!llamadas.has(idRemoto)) return;
  llamadas.delete(idRemoto);
  const li = document.getElementById('p-' + idRemoto);
  if (li) li.remove();
  const audioEl = document.getElementById('audio-' + idRemoto);
  if (audioEl) audioEl.remove();
  sonidoSalida();
}

function agregarParticipanteUI(idRemoto, nombreRemoto) {
  if (document.getElementById('p-' + idRemoto)) return;
  const nombre = nombreRemoto || 'Anónimo';
  const tile = document.createElement('div');
  tile.id = 'p-' + idRemoto;
  tile.className = 'tile';
  tile.innerHTML = `
    <div class="avatar" style="background:${colorDeNombre(nombre)}">${iniciales(nombre)}</div>
    <div class="tile-etiqueta">
      <span class="tile-nombre">${escaparHtml(nombre)}</span>
    </div>
  `;
  grillaTiles.appendChild(tile);
}

function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

// --- Indicador de "quién está hablando" con barras estilo VU ---
function detectarHabla(idRemoto, stream) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const fuente = ctx.createMediaStreamSource(stream);
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 512;
  fuente.connect(analizador);
  const datos = new Uint8Array(analizador.frequencyBinCount);

  function chequear() {
    const tile = document.getElementById('p-' + idRemoto);
    if (!tile) return;
    analizador.getByteFrequencyData(datos);
    const volumen = datos.reduce((a, b) => a + b, 0) / datos.length;
    tile.classList.toggle('hablando', volumen > 15);
    requestAnimationFrame(chequear);
  }
  chequear();
}

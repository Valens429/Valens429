<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 80 340 330" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g>
    <text x="100" y="380" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="320" 
          font-weight="900" 
          fill="url(#orangeGrad)" 
          filter="url(#dropShadow)">L</text>

    <text x="190" y="330" 
          font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-size="320" 
          font-weight="900" 
          fill="url(#orangeGrad)" 
          filter="url(#dropShadow)"
          style="mix-blend-mode: multiply; opacity: 0.95;">S</text>
  </g>
</svg>
